name: Build Hailo-10H Docker Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ghcr-images.yml"
      - "docker/hailo10h/**"
      - "src/hailo10h_*/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model image to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - arcface_mobilefacenet
          - stdc1
          - fcn8_resnet_v1_18
          - mspn_regnetx_800mf
          - lightface_slim
          - face_landmarks_lite
          - yolo26n_seg
          - yolo26s_seg
          - yolo26m_seg
          - paddle_ocr_v5_mobile_detection
          - paddle_ocr_v5_mobile_recognition
          - damoyolo_tinynas_l20_t
          - damoyolo_tinynas_l25_s
          - damoyolo_tinynas_l35_m
          - lprnet
          - tiny_yolov4_license_plates

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: seeed-projects/recomputer-hailo10h-cv
  SOURCE_REPOSITORY: https://github.com/Seeed-Projects/reComputer-Hailo10H-CV

jobs:
  build:
    name: Build ${{ matrix.model }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: arcface_mobilefacenet
            image: arcface_mobilefacenet
            description: ArcFace MobileFaceNet face embedding extraction
          - model: stdc1
            image: stdc1
            description: STDC1 semantic segmentation
          - model: fcn8_resnet_v1_18
            image: fcn8_resnet_v1_18
            description: FCN8 ResNet-18 semantic segmentation
          - model: mspn_regnetx_800mf
            image: mspn_regnetx_800mf
            description: MSPN RegNetX-800MF pose estimation
          - model: lightface_slim
            image: lightface_slim
            description: LightFace Slim face detection
          - model: face_landmarks_lite
            image: face_landmarks_lite
            description: Face Landmarks Lite facial keypoint detection
          - model: yolo26n_seg
            image: yolo26n_seg
            description: YOLO26n-seg instance segmentation
          - model: yolo26s_seg
            image: yolo26s_seg
            description: YOLO26s-seg instance segmentation
          - model: yolo26m_seg
            image: yolo26m_seg
            description: YOLO26m-seg instance segmentation
          - model: paddle_ocr_v5_mobile_detection
            image: paddle_ocr_v5_mobile_detection
            description: PaddleOCR v5 Mobile text detection
          - model: paddle_ocr_v5_mobile_recognition
            image: paddle_ocr_v5_mobile_recognition
            description: PaddleOCR v5 Mobile text recognition
          - model: damoyolo_tinynas_l20_t
            image: damoyolo_tinynas_l20_t
            description: DAMO-YOLO TinyNAS-L20-T object detection
          - model: damoyolo_tinynas_l25_s
            image: damoyolo_tinynas_l25_s
            description: DAMO-YOLO TinyNAS-L25-S object detection
          - model: damoyolo_tinynas_l35_m
            image: damoyolo_tinynas_l35_m
            description: DAMO-YOLO TinyNAS-L35-M object detection
          - model: lprnet
            image: lprnet
            description: Tiny-YOLOv4 plus LPRNet license plate pipeline
          - model: tiny_yolov4_license_plates
            image: tiny_yolov4_license_plates
            description: Tiny-YOLOv4 license plate detection

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select model
        id: selected
        shell: bash
        run: |
          build=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.model }}" == "all" || "${{ github.event.inputs.model }}" == "${{ matrix.model }}" ]]; then
              build=true
            fi
          else
            before_sha="${{ github.event.before }}"
            current_sha="${{ github.sha }}"

            if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]] || ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
              changed_files="$(git show --pretty=format: --name-only "$current_sha")"
            else
              changed_files="$(git diff --name-only "$before_sha" "$current_sha")"
            fi

            echo "Changed files:"
            echo "$changed_files"

            if echo "$changed_files" | grep -Fxq ".github/workflows/build-ghcr-images.yml"; then
              build=true
            elif echo "$changed_files" | grep -Eq "^src/hailo10h_${{ matrix.model }}/|^docker/hailo10h/${{ matrix.model }}\\.dockerfile$"; then
              build=true
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build ${{ matrix.model }}: $build"

      - name: Set up QEMU
        if: steps.selected.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.selected.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.selected.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.selected.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.model }}
            org.opencontainers.image.description=${{ matrix.description }} for Raspberry Pi 5 + Hailo-10H
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.url=${{ env.SOURCE_REPOSITORY }}

      - name: Build and push
        if: steps.selected.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src/hailo10h_${{ matrix.model }}
          file: ./docker/hailo10h/${{ matrix.model }}.dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.model }}
          cache-to: type=gha,mode=max,scope=${{ matrix.model }}
          provenance: false
